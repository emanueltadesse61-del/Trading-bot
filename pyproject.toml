[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
description = "Deterministic trading research; Phase 0 synthetic development only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
